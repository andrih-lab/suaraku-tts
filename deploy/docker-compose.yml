services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      - MODELS_DIR=/app/models
      - RVC_PITCH_SHIFT=${RVC_PITCH_SHIFT:-0}
    # No hard mem_limit: voice conversion (Applio/torch) can use several GB
    # during inference. With the 4GB swap set up by setup-almalinux.sh, it's
    # safer to let it spill into swap (slower) than be OOM-killed mid-request
    # by a strict container limit.
