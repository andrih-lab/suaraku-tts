services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      - MODELS_DIR=/app/models
      - RVC_PITCH_SHIFT=${RVC_PITCH_SHIFT:-0}
    # Keep the container from eating the whole 4GB VPS if something leaks.
    # (mem_limit, not deploy.resources.limits -- the latter only applies
    # under `docker stack deploy` / Swarm, not plain `docker compose up`.)
    mem_limit: 3g
